[project]
name = "kev-serve"
version = "0.1.0"
description = "Standalone Jev-like (TypeSafe System One) deployment service: Noul / Choice / Score / Box primitives"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "torch",
    "transformers",
    "pillow",
    "safetensors",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kev_serve"]
